x-app-env: &app-env
  DATA_DIR: "${DATA_DIR:-data}"
  BASE_DB_PATH: "${BASE_DB_PATH:-data/base_data.db}"
  CONFIG_DB_PATH: "${CONFIG_DB_PATH:-data/config.db}"
  SCORING_DB_PATH: "${SCORING_DB_PATH:-data/scoring.db}"
  TRADING_DB_PATH: "${TRADING_DB_PATH:-data/trading.db}"
  TRADING_CORE_DB_PATH: "${TRADING_CORE_DB_PATH:-data/trading_core.db}"
  TRADING_INFO_DB_PATH: "${TRADING_INFO_DB_PATH:-data/trading_info.db}"
  REAL_TRADING_CORE_DB_PATH: "${REAL_TRADING_CORE_DB_PATH:-data/real_trading_core.db}"
  REAL_TRADING_DB_PATH: "${REAL_TRADING_DB_PATH:-data/real_trading.db}"
  REAL_TRADING_INFO_DB_PATH: "${REAL_TRADING_INFO_DB_PATH:-data/real_trading_info.db}"
  MARKET_DB_PATH: "${MARKET_DB_PATH:-data/market.db}"
  SQLITE_RECOVERY_LOG_DIR: "${SQLITE_RECOVERY_LOG_DIR:-logs/sqlite-recovery}"
  # Never let delayed market aggregation block minute-level position protection indefinitely.
  PROFIT_MARKET_CONVERGENCE_TIMEOUT_SEC: "${PROFIT_MARKET_CONVERGENCE_TIMEOUT_SEC:-10}"
  BINANCE_TESTNET: "${BINANCE_TESTNET:-true}"
  BINANCE_TESTNET_API_KEY: "${BINANCE_TESTNET_API_KEY:-YOUR_TESTNET_API_KEY}"
  BINANCE_TESTNET_SECRET_KEY: "${BINANCE_TESTNET_SECRET_KEY:-YOUR_TESTNET_SECRET_KEY}"
  BINANCE_REAL_API_KEY: "${BINANCE_REAL_API_KEY:-YOUR_REAL_API_KEY}"
  BINANCE_REAL_API_SECRET: "${BINANCE_REAL_API_SECRET:-YOUR_REAL_API_SECRET}"
  BINANCE_REAL_BASE_URL: "${BINANCE_REAL_BASE_URL:-https://fapi.binance.com}"
  REAL_TRADING_INITIAL_EQUITY_USDT: "${REAL_TRADING_INITIAL_EQUITY_USDT:-100}"

services:
  worker:
    build: .
    image: trading-sys-demo:latest
    container_name: trade
    command: ["worker"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    environment:
      <<: *app-env
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_LOGS_DIR:-./logs}:/app/logs

  web:
    build: .
    image: trading-sys-demo:latest
    container_name: trade-web
    command: ["web"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: always
    ports:
      - "5000:5000"
    environment:
      <<: *app-env
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_LOGS_DIR:-./logs}:/app/logs
    depends_on:
      - worker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    # This is an operator-only diagnostic tool.  Keeping it out of the default
    # stack prevents an unmanaged SQLite client from joining the live write
    # path or bypassing the application's recovery fence.
    profiles: ["diagnostics"]
    ports:
      - "127.0.0.1:${SQLITE_WEB_PORT:-8080}:8080"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data:ro
    command: ["sqlite_web", "${SQLITE_WEB_DB_PATH:-/data/base_data.db}", "--host", "0.0.0.0", "--read-only"]
